name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Run tests
        run: go test -v ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Claude Desktop Extension (.mcpb)
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          make package-extension VERSION=${VERSION}
          mv dist/tekmetric-mcp.mcpb dist/tekmetric-mcp-${VERSION}.mcpb

      - name: Upload .mcpb to Release
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          gh release upload "${GITHUB_REF_NAME}" dist/tekmetric-mcp-${VERSION}.mcpb --repo "$GITHUB_REPOSITORY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
