version: 2

before:
  hooks:
    - go mod tidy
    - go test ./...


builds:
  - id: tekmetric-mcp
    main: ./cmd/tekmetric-mcp
    binary: tekmetric-mcp
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

# The Desktop extension names one macOS command for both architectures, so the
# release must carry a universal binary. GoReleaser builds it itself, which
# keeps the release runner free of a macOS dependency on lipo.
universal_binaries:
  - id: tekmetric-mcp-universal
    ids:
      - tekmetric-mcp
    name_template: tekmetric-mcp
    replace: false

archives:
  - id: default
    formats: ["tar.gz"]
    format_overrides:
      - goos: windows
        formats: ["zip"]
    name_template: >-
      {{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}
    files:
      - README.md
      - LICENSE


# Sign and notarize the macOS builds.
#
# Gatekeeper blocks an unsigned binary that carries the quarantine flag, and a
# binary extracted from a downloaded .mcpb carries it. Signing with a Developer
# ID and notarizing clears that.
#
# GoReleaser signs with quill rather than Apple tooling, so this runs on the
# Linux release runner. The step turns itself off when the certificate is
# absent, which keeps a fork building.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids:
        - tekmetric-mcp
        - tekmetric-mcp-universal
      sign:
        certificate: "{{.Env.MACOS_SIGN_P12}}"
        password: "{{.Env.MACOS_SIGN_PASSWORD}}"
      notarize:
        issuer_id: "{{.Env.MACOS_NOTARY_ISSUER_ID}}"
        key_id: "{{.Env.MACOS_NOTARY_KEY_ID}}"
        key: "{{.Env.MACOS_NOTARY_KEY}}"
        wait: true
        timeout: 20m

checksum:
  name_template: '{{ .ProjectName }}-{{ .Version }}-checksums.txt'
  algorithm: sha256
  extra_files:
    - glob: 'dist/*.mcpb'

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch
  groups:
    - title: 'Features'
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: 'Bug Fixes'
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: 'Documentation'
      regexp: '^.*?docs(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: 'Other Changes'
      order: 999

release:
  github:
    owner: beetlebugorg
    name: tekmetric-mcp
  draft: false
  prerelease: auto
  mode: append
  header: |
    ## Tekmetric MCP Server {{ .Tag }}

    {{ .Version }} - {{ .Date }}
  footer: |
    ## Installation

    ### Claude Desktop (Recommended)
    Download `tekmetric-mcp-{{ .Version }}.mcpb` and open with Claude Desktop.

    ### Manual Installation
    Download the appropriate zip file for your platform:
    - **macOS (Apple Silicon)**: `tekmetric-mcp-{{ .Version }}-darwin-arm64.zip`
    - **macOS (Intel)**: `tekmetric-mcp-{{ .Version }}-darwin-amd64.zip`
    - **Linux (x64)**: `tekmetric-mcp-{{ .Version }}-linux-amd64.zip`
    - **Linux (ARM64)**: `tekmetric-mcp-{{ .Version }}-linux-arm64.zip`
    - **Windows (x64)**: `tekmetric-mcp-{{ .Version }}-windows-amd64.zip`

    Extract the zip file and add the binary to your PATH or Claude Desktop configuration.

    See the [Installation Guide](https://beetlebugorg.github.io/tekmetric-mcp/installation) for detailed instructions.

    **Full Changelog**: https://github.com/beetlebugorg/tekmetric-mcp/compare/{{ .PreviousTag }}...{{ .Tag }}
